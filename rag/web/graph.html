<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知识图谱（部分展示） · AI李老师</title>
  <style>
    :root {
      --bg: #070b18; --panel: rgba(15, 23, 42, .78); --ink: #e2e8f0; --soft: #94a3b8; --line: rgba(148, 163, 184, .22);
      --glow: #818cf8; --radius: 12px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); overflow: hidden; }
    body { background: radial-gradient(90% 70% at 20% 0%, #12183a 0%, var(--bg) 60%), var(--bg); }
    header { position: fixed; z-index: 3; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
             padding: 10px 16px; background: linear-gradient(#070b18ee, #070b1800); pointer-events: none; }
    header > * { pointer-events: auto; }
    h1 { margin: 0; font-size: 17px; letter-spacing: .04em; background: linear-gradient(90deg, #a5b4fc, #67e8f9); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .badge { font-size: 12px; color: #fde68a; border: 1px solid rgba(253, 230, 138, .45); border-radius: 999px; padding: 2px 10px; background: rgba(120, 83, 9, .25); }
    a.back { color: var(--soft); font-size: 13px; text-decoration: none; margin-left: auto; }
    a.back:hover { color: var(--ink); }
    #stats { position: fixed; z-index: 3; left: 16px; top: 52px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--soft);
             padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); backdrop-filter: blur(6px); max-width: calc(100vw - 32px); }
    #stats b { color: var(--ink); font-weight: 600; margin: 0; }
    #filters { position: fixed; z-index: 3; left: 16px; bottom: 14px; right: 16px; display: flex; flex-wrap: wrap; gap: 6px; max-height: 84px; overflow: auto; }
    .f { border: 1px solid var(--line); background: var(--panel); color: var(--soft); border-radius: 999px; padding: 3px 11px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .f i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); display: inline-block; }
    .f.on { color: var(--ink); border-color: var(--c); }
    .f.all.on { border-color: var(--glow); }
    #info { position: fixed; z-index: 3; right: 16px; top: 52px; width: 230px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius);
            background: var(--panel); backdrop-filter: blur(6px); font-size: 13px; line-height: 1.7; display: none; }
    #info.show { display: block; }
    #info h3 { margin: 0 0 4px; font-size: 15px; color: #fff; word-break: break-all; }
    #info .k { color: var(--soft); }
    #info button { float: right; border: 0; background: none; color: var(--soft); cursor: pointer; font-size: 16px; line-height: 1; }
    #tip { position: fixed; z-index: 4; pointer-events: none; font-size: 12px; padding: 4px 9px; border-radius: 8px; background: rgba(15, 23, 42, .92); border: 1px solid var(--line); display: none; }
    #chart { position: fixed; inset: 0; }
    #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--soft); font-size: 14px; z-index: 2; pointer-events: none; }
    @media (max-width: 600px) { #info { top: auto; bottom: 100px; right: 12px; left: 12px; width: auto; } #stats { top: 76px; } h1 { font-size: 15px; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <header>
    <h1>知识图谱（部分）</h1>
    <span class="badge">部分展示 · 完整知识图谱受保护</span>
    <a class="back" href="/">← 返回 AI李老师</a>
  </header>
  <div id="stats" aria-live="polite"></div>
  <div id="chart"></div>
  <div id="msg">正在加载知识图谱…</div>
  <div id="info"><button id="info-x" aria-label="关闭">×</button><h3 id="i-name"></h3><div><span class="k">所属章节：</span><span id="i-ch"></span></div><div><span class="k">关联数：</span><span id="i-deg"></span></div></div>
  <div id="tip"></div>
  <div id="filters"></div>
  <script src="/static/vendor/echarts.min.js"></script>
  <script src="/static/graph.js"></script>
</body>
</html>
