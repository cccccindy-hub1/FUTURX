<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI李老师 · 数字治理科研团队</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">🧭</div>
      <div class="brand-text">
        <h1>AI李老师</h1>
        <p class="subtitle">数字治理科研团队 · 学术数字人<a class="kg-link" href="/static/graph.html" target="_blank" rel="noopener">查看知识图谱（部分）</a></p>
      </div>
    </div>
    <div class="status" id="status">
      <button id="new-chat" class="new-chat" type="button" title="清空当前对话，重新开始">新对话</button>
      <span class="dot" id="status-dot"></span>
      <span id="status-text">连接中…</span>
    </div>
  </header>

  <main class="chat" id="chat">
    <div class="welcome" id="welcome">
      <h2>你好，我是 AI 李老师</h2>
      <p>可以问《数据要素》课程知识，也可以问学位论文写作、研究方法等问题，系统会自动判断由哪个知识库回答。试试下面这些问题，或直接输入：</p>
      <div class="suggestions">
        <button class="chip" data-q="数据确权为什么难？">数据确权为什么难？</button>
        <button class="chip" data-q="数据定价有哪些常见方法？">数据定价有哪些常见方法？</button>
        <button class="chip" data-q="文献综述应该怎么写？">文献综述应该怎么写？</button>
      </div>
      <div class="wordcloud" id="wordcloud" aria-label="知识关键词，点击后把“什么是 X？”填入输入框" hidden></div>
      <p class="hint">课程问题的回答依据《数据要素》教材生成，正文中的 [1] [2] 对应文末来源，鼠标悬停可查看出处。</p>
    </div>
  </main>

  <footer class="composer">
    <div class="composer-inner">
      <textarea id="input" rows="1" placeholder="输入你的问题，回车发送（Shift+回车换行）"></textarea>
      <div class="composer-row">
        <div class="composer-opts">
          <label class="topk">
            论文库检索片段
            <select id="topk">
              <option value="2">2</option>
              <option value="4" selected>4</option>
              <option value="6">6</option>
              <option value="8">8</option>
            </select>
          </label>
          <label class="topk">
            访问密钥
            <input id="apikey" type="password" autocomplete="off" placeholder="未启用可留空" />
          </label>
        </div>
        <button id="send" class="send">发送</button>
      </div>
    </div>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
